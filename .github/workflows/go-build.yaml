name: "Go: Build"
on:
  workflow_call: {}

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: errassert
            dir: .
          - name: grpcerrassert
            dir: grpcerrassert
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version: 'stable'


      - id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> $GITHUB_OUTPUT
          echo "go-mod=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT

          mkdir -p "$(go env GOMODCACHE)"
          mkdir -p "$(go env GOCACHE)"

      - name: Go Build Cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-gobuild-build-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gobuild-build-${{ matrix.name }}-

      - name: Go Mod Cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-gomod-build-${{ matrix.name }}-${{ hashFiles(format('{0}/go.mod', matrix.dir), format('{0}/go.sum', matrix.dir)) }}

      - working-directory: ${{ matrix.dir }}
        run: |
          go build -v ./...
