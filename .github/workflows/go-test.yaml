name: "Go: Test"
on:
  workflow_call: {}

permissions: {}

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [".", "grpcerrassert"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version: 'stable'


      - name: Determine Go Cache Paths
        id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> $GITHUB_OUTPUT
          echo "go-mod=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT

          mkdir -p "$(go env GOMODCACHE)"
          mkdir -p "$(go env GOCACHE)"

      - name: Go Build Cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-gobuild-test-${{ matrix.module }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gobuild-test-${{ matrix.module }}-

      - name: Go Mod Cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-gomod-test-${{ matrix.module }}-${{ hashFiles(format('{0}/go.mod', matrix.module), format('{0}/go.sum', matrix.module)) }}

      - working-directory: ${{ matrix.module }}
        run: |
          go test -v \
            -coverprofile=coverage.txt \
            -covermode=atomic \
            -coverpkg=./... \
            ./...

      - name: Collect Code Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: zoido/errassert
          files: ${{ matrix.module }}/coverage.txt
          flags: ${{ matrix.module == '.' && 'errassert' || matrix.module }}
