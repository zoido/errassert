name: "Markdown: Lint"
on:
  workflow_call: {}

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: markdownlint
        uses: nosborn/github-action-markdown-cli@v3
        with:
          files: .
